name: Tests

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12', '13']
                include:
                    - laravel: '12'
                      testbench: '^10.0'
                    - laravel: '13'
                      testbench: '^11.0'

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: fileinfo, intl, mbstring, zip
                  coverage: none

            - name: Install the dependencies for Laravel ${{ matrix.laravel }}
              run: |
                  composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --no-progress

            - run: vendor/bin/phpunit

    lint:
        name: Pint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none

            - run: composer install --prefer-dist --no-interaction --no-progress

            - run: vendor/bin/pint --test
